<div class="auth-container">
    <div class="auth-card">
        <h1>Login</h1>
        
        <div class="form-group">
            <label>Username</label>
            <input [(ngModel)]="username" placeholder="Enter username" class="form-input">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input [(ngModel)]="password" type="password" placeholder="Enter password" class="form-input">
        </div>

        <button (click)="onLogin()" class="auth-btn">Login</button>

        @if(errorMessage){
            <p class="error-text">{{errorMessage}}</p>
        }
    </div>
</div>
