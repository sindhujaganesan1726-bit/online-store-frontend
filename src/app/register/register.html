<div class="auth-container">
    <div class="auth-card">
        <h1>Register</h1>

        <div class="form-group">
            <label>Username</label>
            <input [(ngModel)]="username" placeholder="Enter username" class="form-input">
         </div>
         <div>
            <label>Password</label>
            <input [(ngModel)]="password" type="password" placeholder="Enter password" class="form-input">
         </div>
         <button (click)="onRegister()"class="auth-btn">Register</button>

         @if(errorMessage){
            <p class="error-text">{{errorMessage}}</p>
         }

    </div>

</div>
